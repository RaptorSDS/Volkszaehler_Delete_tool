name: Build Windows EXE

# - Jeder Push / Pull Request: Tests + EXE bauen und als Workflow-Artefakt ablegen
# - Push auf main (z.B. Merge eines Pull Requests) oder manueller Start auf main:
#   GitHub Release "v<__version__>" mit beiden EXE-Dateien erstellen, falls es noch nicht existiert
# - Tag "v*" (z.B. v0.9): Release für diesen Tag erstellen
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Aktuelles Python fuer Windows 10/11
          - target: win10-11
            python: "3.12"
            suffix: ""
            pyinstaller: "pyinstaller==6.11.1"
            requests: "requests>=2.31,<3"
          # Python 3.8 ist die letzte Version, die noch unter Windows 7/8 laeuft
          - target: win7-8
            python: "3.8"
            suffix: "_win7"
            pyinstaller: "pyinstaller==5.13.2"
            requests: "requests==2.31.0"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Read version from source
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/vz_delete_tool.py)
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu __version__ = $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.pyinstaller }}" "${{ matrix.requests }}"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build EXE
        shell: bash
        run: |
          pyinstaller --onefile --windowed --clean \
            --name "VZ_Delete_Tool_v${{ steps.version.outputs.version }}${{ matrix.suffix }}" \
            src/vz_delete_tool.py

      - uses: actions/upload-artifact@v7
        with:
          name: VZ_Delete_Tool_v${{ steps.version.outputs.version }}${{ matrix.suffix }}
          path: dist/*.exe

  release:
    name: GitHub Release
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG existiert bereits - zum Veröffentlichen __version__ erhöhen."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG wird erstellt."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: steps.check.outputs.exists == 'false'
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        if: steps.check.outputs.exists == 'false'
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: VZ Delete Tool ${{ env.TAG }}
          files: dist/*.exe
          generate_release_notes: true
