name: Build Windows EXE

# - Jeder Push / Pull Request: EXE bauen und als Workflow-Artefakt ablegen
# - Tag "v*" (z.B. v0.6): EXE bauen und als GitHub Release veröffentlichen
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Aktuelles Python fuer Windows 10/11
          - target: win10-11
            python: "3.12"
            suffix: ""
            pyinstaller: "pyinstaller==6.11.1"
            requests: "requests>=2.31,<3"
          # Python 3.8 ist die letzte Version, die noch unter Windows 7/8 laeuft
          - target: win7-8
            python: "3.8"
            suffix: "_win7"
            pyinstaller: "pyinstaller==5.13.2"
            requests: "requests==2.31.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Read version from source
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/vz_delete_tool.py)
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu __version__ = $VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.pyinstaller }}" "${{ matrix.requests }}"

      - name: Build EXE
        shell: bash
        run: |
          pyinstaller --onefile --windowed --clean \
            --name "VZ_Delete_Tool_v${{ steps.version.outputs.version }}${{ matrix.suffix }}" \
            src/vz_delete_tool.py

      - uses: actions/upload-artifact@v4
        with:
          name: VZ_Delete_Tool_v${{ steps.version.outputs.version }}${{ matrix.suffix }}
          path: dist/*.exe

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: VZ Delete Tool ${{ github.ref_name }}
          files: dist/*.exe
          generate_release_notes: true
